version: '3.8'

services:
  peerskills:
    image: peerskills:latest
    container_name: peerskills-app
    environment:
      DATABASE_URL: postgresql://peerskills:${DB_PASSWORD:-peerskills-dev-password}@postgres:5432/peerskills
      DB_PASSWORD: ${DB_PASSWORD:-peerskills-dev-password}
      PORT: 3001
      NODE_ENV: ${NODE_ENV:-production}
      JWT_SECRET: ${JWT_SECRET:-change-this-in-production}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: peerskills-postgres
    environment:
      POSTGRES_DB: peerskills
      POSTGRES_USER: peerskills
      POSTGRES_PASSWORD: ${DB_PASSWORD:-peerskills-dev-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peerskills"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
