version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: peerskills-postgres
    environment:
      POSTGRES_DB: peerskills
      POSTGRES_USER: peerskills
      POSTGRES_PASSWORD: ${DB_PASSWORD:-peerskills-dev-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peerskills"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
